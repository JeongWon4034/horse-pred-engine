[project]
name = "race-rank"
version = "0.1.0"
description = "경주 단위 랭킹 예측 — KRA 공공데이터 수집 + listwise 학습"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "python-dotenv>=1.0",
    "torch>=2.13.0",
    "jupyter>=1.1.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "lightgbm>=4.6",      # 팀 기준선(data/model/baseline_lgbm.py) 재현용
    "scipy>=1.14",        # paired bootstrap · 상관
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.5"]

[tool.uv]
package = false
