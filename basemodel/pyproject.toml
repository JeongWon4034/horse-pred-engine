[project]
name = "latte-basemodel"
version = "0.1.0"
description = "경마 예측 베이스 모델 5종 — 6축 타워 랭커 (PyTorch, 허깅페이스 배포)"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "scipy>=1.14",          # paired bootstrap · McNemar · 우도비 검정
    "safetensors>=0.4",     # 허깅페이스 가중치 (pickle 아님)
    "huggingface-hub>=0.25",
    "lightgbm>=4.5",        # 팀 기준선 재현 — 별도 프로세스에서만 돈다 (OpenMP 충돌)
]

# torch 는 PyPI 기본 휠을 쓴다 (macOS = MPS, Linux/Windows = CUDA 12.x 포함).
# RTX 4070 + CUDA 13 환경이라면 pipeline/pyproject.toml 처럼 cu130 인덱스를 걸 것:
#   [[tool.uv.index]] name = "pytorch-cu130"
#   url = "https://download.pytorch.org/whl/cu130"  explicit = true
#   [tool.uv.sources] torch = { index = "pytorch-cu130" }

[tool.uv]
package = false
